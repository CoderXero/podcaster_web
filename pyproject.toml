[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcaster-web"
version = "0.1.0"
description = "A safe operator console for the file-based Podcaster pipeline"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "Jinja2>=3.1",
  "markdown-it-py>=3.0",
  "bleach>=6.1",
  "filelock>=3.15",
  "mutagen>=1.47",
]

[project.scripts]
podcaster-web = "podcaster.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
